Instructions="HypeCubeJam is a UE 5.9 C++ multiplayer free-for-all space shooter (single runtime module HypeCubeJam, class prefix HCJ, log category LogHCJ). Each level is a Sector: a vertex of an N-dimensional hypercube (default N=4, 16 sectors; sector id is a bitmask, neighbours differ in one bit). Open edges (a random connected subset) are portals. Sector contents (asteroid fields, spawn points, portals) and the portal graph are generated deterministically from one match seed replicated in AHCJGameState; server and clients build identical geometry locally. All sectors live in one persistent world at far-apart origins; there is no server travel. There is no authored map: the map is /Engine/Maps/Entry and input actions, lighting and HUD are created in C++. Looks and sounds come from Fab packs under /Game/StarSparrow (ships) and /Game/Megascans (asteroids), both imported from SourceAssets/, /Game/HoverVehicles and /Game/NiagaraExamples, named only in [/Script/HypeCubeJam.HCJAssetSettings] of DefaultGame.ini (class UHCJAssetSettings); every one of them falls back to /Engine/BasicShapes or to no effect when missing, and all collision is basic shapes. Do not add or modify .uasset content unless asked. Players and bots share AHCJShipCharacter (flying CharacterMovement); AHCJBotController bots fill empty combatant slots. Game mode URL options: ?Seed=<int> and ?Dim=<2..6>. Automation tests are named HypeCubeJam.* ."
