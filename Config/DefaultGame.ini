[/Script/HypeCubeJam.HCJGameMode]
; Black holes are gameplay: placed per sector from the match seed, they pull ships and bolts and destroy what
; crosses the event horizon. The server's values are sent to the clients with the match config.
; URL options: ?BlackHoles=0|1 and ?BlackHoleP=<fraction>.
bBlackHoles=True
BlackHoleSectorFraction=0.25
BlackHoleInfluenceRadius=6000.0
BlackHoleHorizonRadius=600.0
BlackHolePullSpeed=200.0
BlackHoleMaxPullSpeed=9000.0
; Wormholes: two-way shortcuts between sectors that are not hypercube neighbours, placed from the match seed.
; WormholeCount < 0 = a quarter of the number of sectors. URL option: ?Wormholes=<n> (0 = none).
; Space stations with gun turrets in about a quarter of the sectors, placed from the match seed. URL option: ?Stations=0|1.
bStations=True
StationSectorFraction=0.2
bWormholes=True
WormholeCount=-1

[/Script/HypeCubeJam.HCJGameplaySettings]
; Weapons, pickups and power-ups (UHCJGameplaySettings, Source/HypeCubeJam/Public/Game/HCJGameplaySettings.h). The server's
; values decide. URL option of the server: ?Pickups=0|1.
; Sustained damage per second at full hit rate: blaster 81, scatter 167 (point blank), rail 106, missiles 108, pulse 129:
; every pickup weapon beats the blaster inside its range. A ship has 100 hull + four shield facings.
; Weapons, in the order blaster, scatter cannon, rail shot, homing missiles, rapid pulse. Ammo=0 means unlimited (blaster only).
+Weapons=(Name="BLASTER",FireInterval=0.16,Damage=13,ProjectileSpeed=20000,Lifetime=2.0,SpreadDegrees=0,Pellets=1,HomingTurnRate=0,HomingConeDegrees=0,Ammo=0,Color=(R=0,G=0,B=0,A=1),VisualScale=1.0,BotMaxRange=16000)
+Weapons=(Name="SCATTER CANNON",FireInterval=0.6,Damage=10,ProjectileSpeed=17000,Lifetime=0.6,SpreadDegrees=4.0,Pellets=10,HomingTurnRate=0,HomingConeDegrees=0,Ammo=16,Color=(R=1.0,G=0.55,B=0.1,A=1),VisualScale=0.6,BotMaxRange=5500)
+Weapons=(Name="RAIL SHOT",FireInterval=0.8,Damage=85,ProjectileSpeed=60000,Lifetime=0.8,SpreadDegrees=0,Pellets=1,HomingTurnRate=0,HomingConeDegrees=0,Ammo=10,Color=(R=0.3,G=0.8,B=1.0,A=1),VisualScale=2.2,BotMaxRange=16000)
+Weapons=(Name="HOMING MISSILES",FireInterval=0.6,Damage=65,ProjectileSpeed=10000,Lifetime=3.5,SpreadDegrees=0,Pellets=1,HomingTurnRate=140,HomingConeDegrees=45,Ammo=10,Color=(R=1.0,G=0.2,B=0.15,A=1),VisualScale=1.0,BotMaxRange=14000)
+Weapons=(Name="RAPID PULSE",FireInterval=0.07,Damage=9,ProjectileSpeed=22000,Lifetime=1.5,SpreadDegrees=1.2,Pellets=1,HomingTurnRate=0,HomingConeDegrees=0,Ammo=160,Color=(R=0.7,G=0.3,B=1.0,A=1),VisualScale=0.7,BotMaxRange=10000)
; Photon torpedo (the secondary weapon of every ship, right mouse; Ship/HCJTorpedo.h). In this row FireInterval is the
; reload time, Ammo the stock of a fresh ship, Damage what one does to the hull through a shield facing that is down,
; HomingTurnRate how fast it steers for the firer's locked target (the homing missile: 140) and HomingConeDegrees the
; cone ahead outside which it loses that target for good.
+Weapons=(Name="TORPEDO",FireInterval=2.0,Damage=70,ProjectileSpeed=9000,Lifetime=2.0,SpreadDegrees=0,Pellets=1,HomingTurnRate=40,HomingConeDegrees=60,Ammo=4,Color=(R=1.0,G=0.3,B=0.06,A=1),VisualScale=1.0,BotMaxRange=9000)
; Phaser (the weapon every ship starts with, left mouse held; Ship/HCJPhaser.h): a beam, no projectile. In this row
; Damage is the damage PER SECOND at close range, BeamRange the reach, FireInterval the step in which the server applies
; the damage, BotMaxRange how far away bots bother. ProjectileSpeed only feeds lead indicators (a beam needs none).
+Weapons=(Name="PHASER",FireInterval=0.1,Damage=58,ProjectileSpeed=1000000,Lifetime=0.1,SpreadDegrees=0,Pellets=1,HomingTurnRate=0,HomingConeDegrees=0,Ammo=0,Color=(R=1.0,G=0.3,B=0.05,A=1),VisualScale=1.0,BotMaxRange=8500,bBeam=True,BeamRange=9000)
; phaser bank: seconds of beam in a full bank; it starts to refill PhaserRechargeDelay after the beam stops and is full
; again after PhaserRechargeSeconds; emptied, it gives no beam (the trigger fires the blaster) until PhaserRelockLevel
PhaserDrainSeconds=4.0
PhaserRechargeDelay=1.0
PhaserRechargeSeconds=5.0
PhaserRelockLevel=0.25
; damage with range: full within this share of BeamRange, then falling in a straight line to PhaserEdgeScale at the end
PhaserFullDamageFraction=0.3
PhaserEdgeScale=0.45
; aim assist of the beam: it bends to a hostile ship within this many degrees of the aim line (more for the locked target)
PhaserAssistDegrees=1.6
PhaserLockAssistDegrees=3.0
; Destroyable asteroids (World/HCJAsteroidField.h; sent to the clients with the match config; URL option ?Rocks=0|1).
; Only phasers and torpedoes damage rock. A rock of at least AsteroidSplitMinRadius breaks into 2-3 pieces (twice at
; most); health = radius * AsteroidHealthPerRadius within [Min, Max]: a 4 m boulder has 88 (1.5 s of phaser up close,
; one torpedo), a 30 m giant 660. Everything is back when the next match starts.
bDestroyableAsteroids=True
AsteroidSplitMinRadius=260.0
AsteroidHealthPerRadius=0.22
AsteroidMinHealth=25.0
AsteroidMaxHealth=700.0
PhaserRockDamageScale=1.0
TorpedoRockDamageScale=1.5
; Shockwaves: an explosion pushes the ships around it (uu/s at the centre, falling to nothing at the radius; 0 = off)
TorpedoShockwaveRadius=1600.0
TorpedoShockwaveSpeed=1300.0
ShipShockwaveRadius=1300.0
ShipShockwaveSpeed=900.0
; most a ship carries / what a TORPEDOES pad gives
TorpedoMaxStock=6
TorpedoRestockAmount=3
; what one torpedo strips from the facing it lands on (a facing has ShieldFacingCapacity): the share of it the facing
; cannot take is the share of Damage that goes on to the hull. Full facing of 26: 26 off the facing, 9 to the hull.
TorpedoShieldDamage=30.0
; armed after this distance (a hit before is a dud doing TorpedoDudDamageFraction of the damage, no blast): at 9000 uu/s
; against a ship's 6000 under boost, a firer chasing his own torpedo is just outside the blast when it arms
TorpedoArmingDistance=1200.0
TorpedoDudDamageFraction=0.15
; blast: full damage to hulls within the inner radius, falling to the edge scale at the outer radius, nothing beyond
TorpedoBlastInnerRadius=120.0
TorpedoBlastRadius=450.0
TorpedoBlastEdgeScale=0.25
; aim assist: bolts hit a ship within this radius of its centre (movement collision stays 60); 0 = off
AimAssistRadius=135.0
; station turrets
TurretRange=7500.0
TurretTurnRate=90.0
TurretFireInterval=0.4
TurretDamage=12.0
TurretProjectileSpeed=14000.0
TurretSpreadDegrees=1.2
TurretFireConeDegrees=5.0
TurretHealth=120.0
TurretRespawnSeconds=60.0
bPickups=True
MinPadsPerSector=3
MaxPadsPerSector=5
RespawnMinSeconds=20.0
RespawnMaxSeconds=30.0
CollectRadius=320.0
