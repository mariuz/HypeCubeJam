ServerDefaultMap=/Engine/Maps/Entry
GlobalDefaultGameMode=/Script/HypeCubeJam.HCJGameMode
GlobalDefaultServerGameMode=/Script/HypeCubeJam.HCJGameMode
; a packaged game started without arguments hosts a listen server (others join with: HypeCubeJam.exe <ip>)
LocalMapOptions=?listen

[/Script/Engine.RendererSettings]
; everything is spawned at runtime, so lighting is fully dynamic
r.AllowStaticLighting=False
; Direct lighting only. The scene is rocks in a void lit by two directional lights, so Lumen GI/reflections,
; virtual shadow maps and TSR add next to nothing visually but cost about 4x the frame time on a low-end GPU
; (measured on a GTX 950 at 1280x720 in a live match: ~26 fps with them, ~100 fps without).
; For stronger hardware: GI 1 / reflections 1 = Lumen, Shadow.Virtual.Enable 1, AntiAliasingMethod 4 = TSR.
r.DynamicGlobalIlluminationMethod=0
r.ReflectionMethod=2
r.Lumen.HardwareRayTracing=False
r.Shadow.Virtual.Enable=0
r.GenerateMeshDistanceFields=True
r.AntiAliasingMethod=2
; dark space scene: eye adaptation would wash the black sky out to grey
r.DefaultFeature.AutoExposure=False
r.DefaultFeature.MotionBlur=False
r.DefaultFeature.Bloom=True

[SystemSettings]
; The engine precaches every global compute pipeline at start. On a GTX 950 the 24 16-bit permutations of the TSR
; shaders (FTSRDecimateHistoryCS / FTSRUpdateHistoryCS / FTSRResolveHistoryCS; the game uses TAA, not TSR) cannot be
; created and each logged three error lines. Created on first use instead, the unused ones are never asked for.
r.PSOPrecache.GlobalShaders=0
; The renderer's red on-screen line "Video memory has been exhausted" (development builds): on a 2 GB card it
; comes up when a second instance or a capture shares the GPU. The amount over budget is still in the log of a
; capture run (LogHCJ "Capture ... video memory N MB over budget").
r.DemotedLocalMemoryWarning=0

