; HypeCubeJam on the web (Wasm). Read only for the Wasm platform. See docs/DEVLOG_NOTES.md, item 28.

[/Script/UnrealEd.ProjectPackagingSettings]
; A web build is a public static site: nothing of the Epic Online Services section may be staged (the web build
; has no EOS code either). UAT strips denied sections and keys from the staged config files.
+IniSectionDenylist=HypeCubeJam.EOS
+IniKeyDenylist=ClientSecret
+IniKeyDenylist=ClientId
+IniKeyDenylist=DeploymentId
+IniKeyDenylist=SandboxId
+IniKeyDenylist=ProductId
; no movie player on the web: the intro movie is not staged (the game skips the intro there). Both lines are
; needed: UAT stages Content/Movies by itself (bSkipMovies) and DefaultGame.ini lists the folder as well.
bSkipMovies=True
!DirectoriesToAlwaysStageAsNonUFS=ClearArray
