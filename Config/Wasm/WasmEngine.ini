; HypeCubeJam on the web (Wasm: WebAssembly + WebGPU). Read only for the Wasm platform; the Windows build never sees
; this file. See docs/DEVLOG_NOTES.md, item 28.

[/Script/WasmTargetPlatform.WasmTargetSettings]
PageTitle=HypeCubeJam
; the click is the gesture a browser needs before it plays sound and locks the pointer
StartMode=Click
; GitHub Pages (no header control): the service worker adds COOP / COEP / CORP and the page reloads once.
; Harmless on hosts that send the headers themselves; inside itch.io's iframe only itch's own
; "SharedArrayBuffer support" embed option isolates the page.
bInjectIsolationHeaders=True
; both mobile tiers (forward for phones / low-end GPUs, deferred for desktop GPUs) are cooked: the engine default
bTargetMobileDeferredTier=True

[/Script/EngineSettings.GameMapsSettings]
; A browser cannot host: no ?listen (the engine would drop it with a warning and load the map standalone anyway).
; The title menu's PLAY starts a standalone match against bots.
LocalMapOptions=
