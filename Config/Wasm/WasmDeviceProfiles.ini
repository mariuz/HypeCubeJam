; HypeCubeJam on the web (Wasm). Read only for the Wasm platform. See docs/DEVLOG_NOTES.md, item 28.
;
; Download size: the cook drops every mip above MaxLODSize, so the 4K / 2K maps of the Fab packs (hover tank parts
; used as turrets, station, ship, asteroids) ship at 1K on the web and the sky maps at 2K. The Windows build keeps
; the engine defaults (this file is not read there).
